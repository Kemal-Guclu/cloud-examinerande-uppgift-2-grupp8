name: CI

on:
  push:
    branches:
      - develop
      - main
      - feature/*
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Hämta repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installera pnpm (måste ske innan node setup)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      # 3️⃣ Installera Node.js (LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4️⃣ Installera beroenden
      - name: Install dependencies
        run: pnpm install

      # 5️⃣ Lint
      - name: Lint code
        run: pnpm lint

      # 6️⃣ Test
      - name: Run tests
        run: pnpm test

      # 7️⃣ Build
      - name: Build Next.js
        run: pnpm build
